<!doctype html>
<!--
  LEGACY markup (/jobs/search/, before the Nov 2026 redesign). Kept so the
  fallback selectors in dom.js stay tested. Current markup: mock-linkedin.html.

  The executable statement of what we believe the source site's job-search
  DOM looks like. Every selector in src/content/dom.js must resolve against
  this file. When the real site changes, this file changes with dom.js, and
  the diff is the record.

  Behaviours modelled (each one was a bug or a design decision):
   - detail pane loads AFTER the card click, holding the previous record for a
     beat (stale-pane guard)
   - results lazy-load as the list scrolls (opacity, not display:none)
   - the apply dialog's progress meter is non-zero on step 1 (prefilled
     contact details), so step must come from Back / "Submit application"
   - a beforeunload guard while the dialog holds typed values
-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>(3) Jobs | LinkedIn</title>
<link rel="icon" href="data:,">
<style>
  body { font: 14px sans-serif; margin: 0; color: #000; background: #f3f2ef; }
  .scaffold-layout__list { float: left; width: 40%; }
  .jobs-search-results-list { height: 640px; overflow: auto; }
  .jobs-search__job-details--container { margin-left: 41%; padding: 12px; }
  .brand { background: #0a66c2; color: #fff; padding: 8px; }
  img { width: 48px; height: 48px; }
</style>
</head>
<body>
<header class="brand">
  <input id="jobs-search-box-keyword-id-ember27" class="jobs-search-box__text-input" aria-label="Search by title, skill, or company" value="product manager">
</header>
<div class="scaffold-layout__list">
  <div class="jobs-search-results-list"><ul id="results"></ul></div>
</div>
<div class="jobs-search__job-details--container"></div>

<script>
(function () {
  const JOBS = [
    ['4071200101', 'Senior Product Manager', 'Harbourline Software', 'Adelaide, SA (Hybrid)', '2026-11-08', '1 day ago', true],
    ['4071200102', 'Product Manager, Payments', 'Tidewell Financial', 'Melbourne, VIC (Remote)', '2026-11-07', '2 days ago', true],
    ['4071200103', 'Lead Product Designer', 'Saltbush Studio', 'Adelaide, SA (On-site)', '2026-11-06', '3 days ago', false],
    ['4071200104', 'Product Owner', 'Kestrel Mining', 'Adelaide, SA (Hybrid)', '2026-11-05', '4 days ago', true],
    ['4071200105', 'Director of Product', 'Northwind Health', 'Sydney, NSW (Hybrid)', '2026-11-04', '5 days ago', false],
    ['4071200106', 'Associate Product Manager', 'Brightwater Labs', 'Adelaide, SA (Hybrid)', '2026-11-04', '5 days ago', true],
    ['4071200107', 'Principal Product Manager - Platform', 'Copperleaf Energy', 'Remote, Australia', '2026-11-03', '6 days ago', true],
    ['4071200108', 'Product Manager', 'Orchard Lane Retail', 'Adelaide, SA (On-site)', '2026-11-02', '1 week ago', false],
    ['4071200109', 'Senior Product Owner', 'Southbank Ports', 'Melbourne, VIC (Hybrid)', '2026-11-02', '1 week ago', true],
    ['4071200110', 'Graduate Product Analyst', 'Pinecrest Group', 'Adelaide, SA (Hybrid)', '2026-11-01', '1 week ago', true],
    ['4071200111', 'Head of Product', 'Marlow & Hale', 'Brisbane, QLD (Hybrid)', '2026-10-31', '1 week ago', false],
    ['4071200112', 'Technical Product Manager', 'Harbourline Software', 'Adelaide, SA (Hybrid)', '2026-10-30', '1 week ago', true],
    ['4071200113', 'Product Manager - Growth', 'Tamsin Logistics', 'Remote, Australia', '2026-10-29', '1 week ago', true],
    ['4071200114', 'Senior Product Manager, AI', 'Redfern Clinics', 'Sydney, NSW (Remote)', '2026-10-28', '1 week ago', false],
    ['4071200115', 'Product Lead', 'Northgate Council', 'Adelaide, SA (On-site)', '2026-10-27', '2 weeks ago', true],
    ['4071200116', 'Product Manager', 'Tidewell Financial', 'Adelaide, SA (Hybrid)', '2026-10-26', '2 weeks ago', true],
    ['4071200117', 'Staff Product Manager', 'Copperleaf Energy', 'Perth, WA (Hybrid)', '2026-10-25', '2 weeks ago', false],
    ['4071200118', 'Junior Business Analyst', 'Kestrel Mining', 'Adelaide, SA (On-site)', '2026-10-24', '2 weeks ago', true],
    ['4071200119', 'VP Product', 'Saltbush Studio', 'Remote, Australia', '2026-10-23', '2 weeks ago', false],
    ['4071200120', 'Product Manager, Data', 'Brightwater Labs', 'Melbourne, VIC (Hybrid)', '2026-10-22', '2 weeks ago', true],
    ['4071200121', 'Senior Product Designer', 'Orchard Lane Retail', 'Adelaide, SA (Hybrid)', '2026-10-21', '2 weeks ago', true],
    ['4071200122', 'Product Operations Manager', 'Southbank Ports', 'Adelaide, SA (Hybrid)', '2026-10-20', '3 weeks ago', false],
    ['4071200123', 'Product Manager', 'Pinecrest Group', 'Sydney, NSW (On-site)', '2026-10-19', '3 weeks ago', true],
    ['4071200124', 'Senior Product Manager - Mobile', 'Redfern Clinics', 'Adelaide, SA (Remote)', '2026-10-18', '3 weeks ago', true],
    ['4071200125', 'Product Owner', 'Tamsin Logistics', 'Brisbane, QLD (Hybrid)', '2026-10-17', '3 weeks ago', false],
    ['4071200126', 'Group Product Manager', 'Marlow & Hale', 'Melbourne, VIC (Hybrid)', '2026-10-16', '3 weeks ago', true],
    ['4071200127', 'Product Manager, Integrations', 'Harbourline Software', 'Remote, Australia', '2026-10-15', '3 weeks ago', true],
    ['4071200128', 'Product Analyst', 'Northgate Council', 'Adelaide, SA (On-site)', '2026-10-14', '3 weeks ago', false],
  ];
  const state = { saved: {}, applied: {}, loaded: 20, current: null };
  const M = (window.__mock = { state, unloadAttempts: 0, searches: [], delay: 25, removedModals: 0 });

  window.addEventListener('beforeunload', (e) => {
    if (document.querySelector('[role="dialog"]')) {
      M.unloadAttempts++;
      e.preventDefault();
      e.returnValue = '';
    }
  });

  const results = document.getElementById('results');
  const list = document.querySelector('.jobs-search-results-list');
  const pane = document.querySelector('.jobs-search__job-details--container');

  function footer(j) {
    const id = j[0];
    const st = state.applied[id] ? 'Applied' : state.saved[id] ? 'Saved' : '';
    return `<li><time datetime="${j[4]}">${j[5]}</time></li>` +
      (st ? `<li class="job-card-container__footer-job-state">${st}</li>` : '') +
      (j[6] ? '<li><span>Easy Apply</span></li>' : '');
  }
  function cardHTML(j) {
    return `<li data-occludable-job-id="${j[0]}" class="jobs-search-results__list-item">
      <div class="job-card-container job-card-container--clickable" data-job-id="${j[0]}">
        <img alt="${j[2]} logo" src="data:,">
        <div class="artdeco-entity-lockup__title"><a class="job-card-list__title--link" href="/jobs/view/${j[0]}/" aria-label="${j[1]}"><strong>${j[1]}</strong></a></div>
        <div class="artdeco-entity-lockup__subtitle"><span>${j[2]}</span></div>
        <ul class="job-card-container__metadata-wrapper"><li>${j[3]}</li></ul>
        <ul class="job-card-container__footer-wrapper">${footer(j)}</ul>
      </div></li>`;
  }
  function renderList() {
    results.innerHTML = JOBS.slice(0, state.loaded).map(cardHTML).join('');
    // an occluded placeholder, as the real list keeps off-screen cards empty
    results.insertAdjacentHTML('beforeend', '<li data-occludable-job-id="4071299999"></li>');
  }
  function refreshCard(id) {
    const j = JOBS.find((x) => x[0] === id);
    const li = results.querySelector(`[data-occludable-job-id="${id}"]`);
    if (li) li.querySelector('.job-card-container__footer-wrapper').innerHTML = footer(j);
  }

  function renderDetail(j) {
    const id = j[0];
    const saved = !!state.saved[id];
    pane.innerHTML = `
      <div class="jobs-details">
        <h1 class="t-24 job-details-jobs-unified-top-card__job-title"><a href="/jobs/view/${id}/">${j[1]}</a></h1>
        <div class="job-details-jobs-unified-top-card__company-name">${j[2]}</div>
        <button class="jobs-save-button artdeco-button" aria-pressed="${saved}" aria-label="${saved ? 'Saved' : 'Save'} ${j[1]} at ${j[2]}"><span>${saved ? 'Saved' : 'Save'}</span></button>
        ${state.applied[id] ? '<span>Applied</span>' : `<button class="jobs-apply-button artdeco-button artdeco-button--primary" aria-label="${j[6] ? 'Easy Apply to' : 'Apply to'} ${j[1]} at ${j[2]}"><span>${j[6] ? 'Easy Apply' : 'Apply'}</span></button>`}
        <article class="jobs-description__container"><div id="job-details" class="jobs-box__html-content">
          <h2>About the job</h2>
          <p>${j[2]} is hiring a ${j[1]} to join the team in ${j[3].split(',')[0]}.</p>
          <p>You will own discovery, delivery and outcomes for a product area used by thousands of customers.</p>
          <p><strong>What you'll do</strong></p>
          <ul><li>Run discovery with customers and internal teams</li><li>Write clear specs and work closely with engineering</li><li>Define success metrics and report on them</li></ul>
          <p><strong>About you</strong></p>
          <ul><li>Experience shipping B2B SaaS products</li><li>Comfortable with data and experimentation</li><li>Strong written communication</li></ul>
          <p>We offer flexible hours, hybrid work and a learning budget.</p>
        </div></article>
      </div>`;
  }

  results.addEventListener('click', (e) => {
    const a = e.target.closest('a[href*="/jobs/view/"]');
    const card = e.target.closest('[data-occludable-job-id]');
    if (a) e.preventDefault();
    if (!card) return;
    const j = JOBS.find((x) => x[0] === card.getAttribute('data-occludable-job-id'));
    if (!j) return;
    state.current = j;
    // the previous record stays in the pane until this fires
    setTimeout(() => state.current === j && renderDetail(j), M.delay);
  });

  pane.addEventListener('click', (e) => {
    const j = state.current;
    if (!j) return;
    if (e.target.closest('.jobs-save-button')) {
      state.saved[j[0]] = !state.saved[j[0]];
      renderDetail(j);
      refreshCard(j[0]);
    }
    if (e.target.closest('.jobs-apply-button')) {
      if (j[6]) openModal(j);
      else M.externalOpened = j[0];
    }
    if (e.target.closest('a')) e.preventDefault();
  });

  list.addEventListener('scroll', () => {
    if (state.loaded < JOBS.length) {
      state.loaded = Math.min(JOBS.length, state.loaded + 10);
      renderList();
    }
  });

  const header = document.getElementById('jobs-search-box-keyword-id-ember27');
  header.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') M.searches.push(header.value);
  });

  // ---- apply dialog ----
  const answers = { email: 'me@example.com', phone: '0400 000 000', years: '', rights: '', follow: true };
  let step = 1;
  let modal = null;
  function openModal(j) {
    step = 1;
    modal = document.createElement('div');
    modal.className = 'artdeco-modal jobs-easy-apply-modal';
    modal.setAttribute('role', 'dialog');
    modal.setAttribute('aria-labelledby', 'jobs-apply-header');
    modal.dataset.job = j[0];
    document.body.appendChild(modal);
    paintModal();
  }
  function paintModal() {
    const pct = { 1: 33, 2: 67, 3: 100 }[step];
    let body = '';
    if (step === 1)
      body = `
        <div data-test-form-element class="fb-dash-form-element"><label for="am-email">Email address<span aria-hidden="true">*</span></label>
          <select id="am-email" required><option value="me@example.com">me@example.com</option><option value="work@example.com">work@example.com</option></select></div>
        <div data-test-form-element class="fb-dash-form-element"><label for="am-phone">Mobile phone number*</label>
          <input id="am-phone" type="text" required value="${answers.phone}"></div>`;
    if (step === 2)
      body = `
        <div data-test-form-element class="fb-dash-form-element"><label for="am-years">How many years of product management experience do you have?</label>
          <input id="am-years" type="text" aria-required="true" value="${answers.years}"></div>
        <fieldset data-test-form-element class="fb-dash-form-element"><legend>Do you have the right to work in Australia?*</legend>
          <input type="radio" id="am-r1" name="rights" value="Yes" ${answers.rights === 'Yes' ? 'checked' : ''}><label for="am-r1">Yes</label>
          <input type="radio" id="am-r2" name="rights" value="No" ${answers.rights === 'No' ? 'checked' : ''}><label for="am-r2">No</label></fieldset>
        <div data-test-form-element class="fb-dash-form-element"><label for="am-cv">Resume</label><input id="am-cv" type="file"></div>`;
    if (step === 3)
      body = `
        <div data-test-form-element class="fb-dash-form-element"><label for="am-follow">Follow this company to stay up to date</label>
          <input id="am-follow" type="checkbox" ${answers.follow ? 'checked' : ''}></div>`;
    const primary = step === 1 ? 'Continue to next step' : step === 2 ? 'Review your application' : 'Submit application';
    modal.innerHTML = `
      <h2 id="jobs-apply-header">Apply</h2>
      <progress max="100" value="${pct}" aria-label="Your job application progress is at ${pct} percent."></progress>
      <form>${body}</form>
      <footer>
        ${step > 1 ? '<button type="button" aria-label="Back to previous step" class="artdeco-button--secondary">Back</button>' : ''}
        <button type="button" aria-label="${primary}" class="artdeco-button--primary">${step === 3 ? 'Submit application' : step === 2 ? 'Review' : 'Next'}</button>
      </footer>`;
    modal.querySelector('form').addEventListener('input', capture);
    modal.querySelector('form').addEventListener('change', capture);
  }
  function capture(e) {
    const t = e.target;
    if (t.id === 'am-email') answers.email = t.value;
    if (t.id === 'am-phone') answers.phone = t.value;
    if (t.id === 'am-years') answers.years = t.value;
    if (t.name === 'rights') answers.rights = t.value;
    if (t.id === 'am-follow') answers.follow = t.checked;
  }
  document.body.addEventListener('click', (e) => {
    if (!modal || !modal.contains(e.target)) return;
    const b = e.target.closest('button');
    if (!b) return;
    const label = b.getAttribute('aria-label');
    if (label === 'Back to previous step') step--;
    else if (label === 'Submit application') {
      state.applied[modal.dataset.job] = true;
      refreshCard(modal.dataset.job);
      modal.remove();
      M.removedModals++;
      modal = null;
      if (state.current) renderDetail(state.current);
      return;
    } else step++;
    paintModal();
  });
  M.answers = answers;
  M.modal = () => document.querySelector('[role="dialog"]');
  M.field = (k) => M.modal() && M.modal().querySelector({ phone: '#am-phone', years: '#am-years' }[k]);
  M.cardCount = () => document.querySelectorAll('#results [data-job-id]').length;
  M.kind = 'legacy';
  M.dismissModal = () => { if (modal) { modal.remove(); modal = null; } };

  renderList();
})();
</script>
</body>
</html>
